<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Modular AR - Master Target</title>
    
    <!-- スタイルシートの読み込み -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- 外部ライブラリ -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>

    <!-- プロジェクトのモジュール群を読み込み -->
    <script src="js/config.js"></script>
    <script src="js/ar-core.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
</head>
<body>
    <div id="header"><p>Loading...</p></div>
    <button id="info-btn" class="info-btn" onclick="toggleCredits()">i</button>
    <button id="settings-btn" class="settings-btn" onclick="toggleSettingsModal()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="white">
            <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
        </svg>
    </button>
    <div id="credits-info" class="hidden">
        <h3>Licenses & Credits</h3>
        <p>AR: Mind-AR (MIT) / Models: Meshy (CC BY 4.0)</p>
    </div>

    <!-- 設定モーダル -->
    <div id="settings-modal" class="hidden">
        <div class="settings-content">
            <h3>設定</h3>
            <div class="settings-item">
                <label>
                    <input type="checkbox" id="test-mode-checkbox" onchange="onTestModeChange(this.checked)">
                    テストモードを有効にする
                </label>
            </div>
            <button class="settings-close-btn" onclick="toggleSettingsModal()">閉じる</button>
        </div>
    </div>

    <!-- GPS・ジオラマ切り替えUI -->
    <div id="gps-switch-btn" onclick="switchARMode()">外で見てみる！ (GPS)</div>
    
    <!-- AR・鑑賞用UI -->
    <div id="capture-btn" onclick="takePhoto()"></div>
    <div id="mode-toggle-btn" onclick="toggleMode()">ゲームモードにする</div>

    <!-- ゲームプレイ用UI -->
    <div id="timer-display" class="hidden">残り時間: 10秒</div>
    <div id="score-display" class="hidden">捕まえた数: 0</div>

    <!-- リザルト画面（オーバーレイ） -->
    <div id="result-screen" class="hidden">
        <div class="result-content">
            <h2>結果発表！</h2>
            <p id="result-score">0 匹捕まえた！</p>
            <p id="result-message">まだまだです。もっとがんばりましょう</p>
            
            <div class="result-buttons">
                <button onclick="startGameMode()">リセットして再挑戦</button>
                <button onclick="startViewMode()" class="btn-secondary">鑑賞モードへ戻る</button>
            </div>
            
            <div class="share-section">
                <p>結果画像をシェアする</p>
                <div class="share-buttons">
                    <button class="share-btn unified" onclick="shareTo()">📤 SNSでシェアする</button>
                </div>
            </div>
        </div>
    </div>

    <!-- AR空間の描画領域のコンテナ -->
    <div id="scene-container">
        <video id="shared-webcam" autoplay playsinline muted></video>
    </div>

    <script>
        // カメラの共通化処理 (getUserMediaのフック)
        (function() {
            let activeStream = null;

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);

                navigator.mediaDevices.getUserMedia = async function(constraints) {
                    console.log("Mocked getUserMedia: Requested with constraints:", JSON.stringify(constraints));

                    // すでにアクティブなストリームがあれば、そのクローンを返す
                    if (activeStream && activeStream.getVideoTracks()[0].readyState === 'live') {
                        console.log("Mocked getUserMedia: Returning cloned active stream.");
                        return activeStream.clone();
                    }

                    // 統一された高画質背面カメラの constraints
                    const unifiedConstraints = {
                        audio: false,
                        video: {
                            facingMode: { ideal: "environment" },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    };

                    try {
                        console.log("Mocked getUserMedia: Initializing unified camera stream...");
                        const stream = await originalGetUserMedia(unifiedConstraints);
                        activeStream = stream;
                        return stream.clone();
                    } catch (err) {
                        console.warn("Mocked getUserMedia failed with unified constraints, falling back to original request:", err);
                        const stream = await originalGetUserMedia(constraints);
                        return stream;
                    }
                };
            }
        })();

        window.TestMode = localStorage.getItem('testMode') === 'true';

        // 共通シーン生成ヘルパー関数
        function createARScene(mode) {
            const scene = document.createElement('a-scene');
            scene.setAttribute('embedded', '');
            scene.setAttribute('vr-mode-ui', 'enabled: false');
            
            // 共通のレンダラー設定（高解像度＆アンチエイリアス有効）
            scene.setAttribute('renderer', 'antialias: true; devicePixelRatio: 2; alpha: true; preserveDrawingBuffer: true; colorManagement: true;');

            // 共通アセット
            scene.innerHTML = `<a-assets id="asset-manager"></a-assets>`;

            // カメラの追加
            const camera = document.createElement('a-camera');
            if (mode === 'gps') {
                camera.setAttribute('gps-camera', 'gpsMinDistance: 5;');
                camera.setAttribute('rotation-reader', '');
            } else {
                camera.setAttribute('position', '0 0 0');
                camera.setAttribute('look-controls', 'enabled: false');
            }
            scene.appendChild(camera);

            // 各ARライブラリ固有の設定を適用
            if (mode === 'gps') {
                // AR.jsの画質を改善するために sourceWidth, sourceHeight 等を設定。videoTexture: false に変更し背景テクスチャ描画を無効化。
                scene.setAttribute('arjs', 'sourceType: webcam; videoTexture: false; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 720; destWidth: 1280; destHeight: 720;');
            } else {
                scene.setAttribute('cursor', 'rayOrigin: mouse');
                scene.setAttribute('raycaster', 'objects: .clickable');
                scene.setAttribute('mindar-image', `imageTargetSrc: ${window.AppConfig.core.masterMind}; uiScanning: no;`);
            }

            return scene;
        }

        (async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode') || 'diorama';
            window.AR_MODE = mode;

            // ボタンの表示テキスト・スタイルの切り替え
            const switchBtn = document.getElementById('gps-switch-btn');
            if (mode === 'gps') {
                switchBtn.innerText = "ジオラマモード";
                switchBtn.classList.add('gps-mode-active');
            } else {
                switchBtn.innerText = "外で見てみる！ (GPS)";
                switchBtn.classList.remove('gps-mode-active');
            }

            const sceneContainer = document.getElementById('scene-container');

            if (mode === 'gps') {
                document.querySelector('#header p').innerText = "GPSを取得中...";

                // AR.jsのダイナミックロード
                await new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = "https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js";
                    s.onload = resolve;
                    s.onerror = reject;
                    document.head.appendChild(s);
                });
            } else {
                // MindARのダイナミックロード
                await new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js";
                    s.onload = resolve;
                    s.onerror = reject;
                    document.head.appendChild(s);
                });
            }

            // 自前で共通カメラを起動して背景に表示
            const sharedVideo = document.getElementById('shared-webcam');
            if (sharedVideo) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                    sharedVideo.srcObject = stream;
                    await sharedVideo.play();
                } catch (e) {
                    console.error("Failed to start shared webcam:", e);
                }
            }

            // 共通シーン生成関数を用いてシーンを作成・追加
            const scene = createARScene(mode);
            sceneContainer.appendChild(scene);

            // 初期化完了イベントを発火
            window.dispatchEvent(new CustomEvent('ARSceneReady'));
        })();

        function switchARMode() {
            const nextMode = window.AR_MODE === 'gps' ? 'diorama' : 'gps';
            window.location.search = `?mode=${nextMode}`;
        }

        function toggleSettingsModal() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('test-mode-checkbox').checked = window.TestMode;
            }
        }
        window.toggleSettingsModal = toggleSettingsModal;

        function onTestModeChange(checked) {
            window.TestMode = checked;
            localStorage.setItem('testMode', checked ? 'true' : 'false');
            if (window.UIManager && typeof window.UIManager.handleTestModeChange === 'function') {
                window.UIManager.handleTestModeChange(checked);
            }
        }
        window.onTestModeChange = onTestModeChange;
    </script>
</body>
</html>
