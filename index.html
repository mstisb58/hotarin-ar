<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Modular AR - Master Target</title>

    <!-- スタイルシートの読み込み -->
    <link rel="stylesheet" href="css/style.css">

    <!-- 外部ライブラリ -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>

    <!-- プロジェクトのモジュール群を読み込み -->
    <script src="js/config.js"></script>
    <script src="js/mode-state.js"></script>
    <script src="js/ar-core.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
</head>

<body>
    <div id="header">
        <p>Loading...</p>
    </div>
    <button id="info-btn" class="info-btn" onclick="toggleCredits()">i</button>
    <button id="settings-btn" class="settings-btn" onclick="toggleSettingsModal()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="white">
            <path
                d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z" />
        </svg>
    </button>
    <div id="credits-info" class="hidden">
        <h3>Licenses & Credits</h3>
        <p>AR: Mind-AR (MIT) / Models: Meshy (CC BY 4.0)</p>
        <div id="version-info" class="version-tag">
            <span class="ver-label">GitHub Version:</span>
            <span id="git-version">v4.13</span>
            (<a id="git-commit-link" href="https://github.com/mstisb58/hotarin-ar/commit/9fb0a8a" target="_blank"><span
                    id="git-commit">9fb0a8a</span></a>)
        </div>
    </div>

    <!-- 設定モーダル -->
    <div id="settings-modal" class="hidden">
        <div class="settings-content">
            <h3>設定</h3>
            <div class="settings-item">
                <label>
                    <input type="checkbox" id="test-mode-checkbox" onchange="onTestModeChange(this.checked)">
                    テストモードを有効にする
                </label>
            </div>

            <!-- テストモード サブボタン／オプション -->
            <div id="test-suboptions" class="test-suboptions hidden">
                <div class="suboptions-title">▼ テスト機能サブオプション</div>
                <div class="settings-item sub-item">
                    <label>
                        <input type="checkbox" id="test-show-bounds-checkbox"
                            onchange="onTestShowBoundsChange(this.checked)">
                        📐 配置やサイズを表示
                    </label>
                </div>
                <p class="settings-note">🎯 テストモードではNFTを仮想認識します</p>
            </div>

            <button class="settings-close-btn" onclick="toggleSettingsModal()">閉じる</button>
        </div>
    </div>

    <!-- リアルタイム デバッグ・サイズ表示HUD -->
    <div id="debug-hud" class="hidden"></div>


    <!-- 等身大(Surround)・ジオラマ切り替えUI -->
    <div id="gps-switch-btn" onclick="switchARMode()">周囲に表示 (等身大)</div>

    <!-- AR・鑑賞用UI -->
    <div id="capture-btn" onclick="takePhoto()"></div>
    <div id="mode-toggle-btn" onclick="toggleMode()">ゲームモードにする</div>

    <!-- ゲームプレイ用UI -->
    <div id="timer-display" class="hidden">残り時間: 10秒</div>
    <div id="score-display" class="hidden">捕まえた数: 0</div>

    <!-- リザルト画面（オーバーレイ） -->
    <div id="result-screen" class="hidden">
        <div class="result-content">
            <h2>結果発表！</h2>
            <p id="result-score">0 匹捕まえた！</p>
            <p id="result-message">まだまだです。もっとがんばりましょう</p>

            <div class="result-buttons">
                <button onclick="startGameMode()">リセットして再挑戦</button>
                <button onclick="startViewMode()" class="btn-secondary">鑑賞モードへ戻る</button>
            </div>

            <div class="share-section">
                <p>結果画像をシェアする</p>
                <div class="share-buttons">
                    <button class="share-btn unified" onclick="shareTo()">📤 SNSでシェアする</button>
                </div>
            </div>
        </div>
    </div>

    <!-- AR空間の描画領域のコンテナ -->
    <div id="scene-container">
        <video id="shared-webcam" autoplay playsinline muted></video>
    </div>

    <script src="js/bootstrap.js"></script>
</body>

</html>
