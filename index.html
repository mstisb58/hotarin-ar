<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Modular AR - Master Target v1.5.2</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>

    <script>
        const arsystem = ["hotarin", "hotarin2", "train", "sounyan"]; 
        const SHOW_ALL_DEBUG = true; 
        const MASTER_MIND = "./assets/target.mind";

        // 動的スクリプトロード
        arsystem.forEach(id => {
            const script = document.createElement('script');
            script.src = `assets/${id}/motion.js`;
            document.head.appendChild(script);
        });

        // ==========================================
        // ★ メッセージ設定（後からここを編集してください）
        // ==========================================
        const RESULT_MESSAGES = [
            { min: 20, text: "すごい！虫取り名人ですね♪" },
            { min: 10, text: "よくできました！あともう一息！" },
            { min: 5,  text: "なかなかやりますね！次はもっと捕まえられるかも！" },
            { min: 0,  text: "まだまだです。もっとがんばりましょう" }
        ];
        
        const HASHTAGS = "#横浜ビジネスパーク夏祭り #ほたりん #YBPプラモ部";

        // 状態管理変数
        let currentMode = 'view'; // 'view', 'game', 'result'
        let score = 0;
        let hotarinCount = 0;
        const MAX_HOTARIN = 7; // ★同時に出現できる最大数（元5→7に変更）
        let spawnInterval = null;
        let mainTarget = null;
        
        let gameTimer = null;
        let timeLeft = 10;
        const GAME_DURATION = 10; // ゲームの制限時間（秒）

        // シェア用画像保持変数
        let resultImageBlob = null;
        let resultImageUrl = null;

        window.addEventListener("DOMContentLoaded", () => {
            const scene = document.querySelector('a-scene');
            const assetManager = document.querySelector('#asset-manager');
            const headerText = document.querySelector('#header p');
            headerText.innerText = "ターゲットを映してね！";

            scene.setAttribute('mindar-image', `imageTargetSrc: ${MASTER_MIND}; uiScanning: no;`);

            mainTarget = document.createElement('a-entity');
            mainTarget.setAttribute('mindar-image-target', 'targetIndex: 0');
            scene.appendChild(mainTarget);

            mainTarget.addEventListener("targetFound", () => { headerText.innerText = "ジオラマが起動しました！"; });
            mainTarget.addEventListener("targetLost", () => { headerText.innerText = "ターゲットを映してね！"; });

            // アセット事前読み込み
            arsystem.forEach((id) => {
                const assetItem = document.createElement('a-asset-item');
                assetItem.setAttribute('id', `${id}Model`);
                assetItem.setAttribute('src', `assets/${id}/model.glb`);
                assetManager.appendChild(assetItem);
            });

            let lastTouchTime = 0;

            function handleInteraction(e) {
                if(currentMode === 'game') {
                    // タッチとクリックの重複処理を防止
                    if (e.type === 'touchstart') {
                        lastTouchTime = Date.now();
                    } else if (e.type === 'click' && Date.now() - lastTouchTime < 300) {
                        return;
                    }

                    // UIクリック時は反応させない
                    if(e.target.closest('#mode-toggle-btn') || e.target.closest('#capture-btn') || e.target.closest('#info-btn')) return;
                    
                    // 座標の取得（タッチかマウスか）
                    let clientX, clientY;
                    if (e.touches && e.touches.length > 0) {
                        clientX = e.touches[0].clientX;
                        clientY = e.touches[0].clientY;
                    } else {
                        clientX = e.clientX;
                        clientY = e.clientY;
                    }

                    showBugNet(clientX, clientY);

                    // 手動Raycast: A-Frameのcursorズレ問題を解消
                    const sceneEl = document.querySelector('a-scene');
                    const camera = sceneEl.camera;
                    if (!camera) return;

                    const mouse = new THREE.Vector2();
                    const rect = sceneEl.canvas.getBoundingClientRect();
                    mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(mouse, camera);

                    const clickables = document.querySelectorAll('.clickable');
                    const objectsToIntersect = [];
                    clickables.forEach(el => {
                        if (el.object3D) objectsToIntersect.push(el.object3D);
                    });

                    const intersects = raycaster.intersectObjects(objectsToIntersect, true);
                    
                    if (intersects.length > 0) {
                        let hitObj = intersects[0].object;
                        while(hitObj && hitObj.el === undefined) {
                            hitObj = hitObj.parent;
                        }
                        let hitEl = hitObj ? hitObj.el : null;
                        
                        while(hitEl && hitEl !== sceneEl) {
                            if(hitEl.classList && hitEl.classList.contains('clickable')) {
                                catchHotarin(hitEl);
                                break;
                            }
                            hitEl = hitEl.parentNode;
                        }
                    }
                }
            }

            // 画面クリック・タップ時の虫取り網エフェクトと当たり判定
            window.addEventListener('click', handleInteraction);
            window.addEventListener('touchstart', handleInteraction, { passive: false });

            // 初期状態は鑑賞モード
            startViewMode();
        });

        // ==========================
        // モード管理ロジック
        // ==========================

        function clearScene() {
            while (mainTarget.firstChild) {
                mainTarget.removeChild(mainTarget.firstChild);
            }
            if (spawnInterval) clearInterval(spawnInterval);
            if (gameTimer) clearInterval(gameTimer);
            spawnInterval = null;
            gameTimer = null;
            hotarinCount = 0;
        }

        function startViewMode() {
            currentMode = 'view';
            clearScene();
            
            // UI表示制御
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('score-display').classList.add('hidden');
            document.getElementById('timer-display').classList.add('hidden');
            document.getElementById('capture-btn').classList.remove('hidden'); 
            
            const toggleBtn = document.getElementById('mode-toggle-btn');
            toggleBtn.classList.remove('hidden');
            toggleBtn.innerText = "ゲームモードにする";

            // 全キャラを配置（ゲーム専用のhotarin2は除外）
            arsystem.forEach((id) => {
                if (id === 'hotarin2') return; // 観賞モードには出さない
                const container = document.createElement('a-entity');
                container.innerHTML = `
                    <a-entity ${id}-logic="showDebugBox: false">
                        <a-gltf-model src="#${id}Model" rotation="90 0 0" animation-mixer></a-gltf-model>
                    </a-entity>
                `;
                mainTarget.appendChild(container);
            });
        }

        function startGameMode() {
            currentMode = 'game';
            clearScene();
            
            // UI表示制御
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('capture-btn').classList.add('hidden'); 
            document.getElementById('mode-toggle-btn').classList.add('hidden'); 
            document.getElementById('score-display').classList.remove('hidden');
            document.getElementById('timer-display').classList.remove('hidden');
            
            // パラメータ初期化
            score = 0;
            timeLeft = GAME_DURATION;
            updateScoreUI();
            updateTimerUI();

            // 背景キャラ配置（ゲームモード時はhotarin2を削除）
            const backgrounds = ["train", "sounyan"];
            backgrounds.forEach((id) => {
                const bgContainer = document.createElement('a-entity');
                bgContainer.innerHTML = `
                    <a-entity ${id}-logic="showDebugBox: false">
                        <a-gltf-model src="#${id}Model" rotation="90 0 0" animation-mixer></a-gltf-model>
                    </a-entity>
                `;
                mainTarget.appendChild(bgContainer);
            });

            // ゲーム用タイマー開始
            gameTimer = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // スポーン処理開始
            spawnInterval = setInterval(() => {
                if(hotarinCount < MAX_HOTARIN) {
                    spawnHotarin(mainTarget);
                }
            }, 600); // ★ポップ頻度（ミリ秒）。600 ＝ 0.6秒ごとに1匹出現
            
            // 最初に1匹すぐに出す
            spawnHotarin(mainTarget);
        }

        function endGame() {
            currentMode = 'result';
            
            // ★シーンを消す直前のAR映像を「リザルト画像」としてキャプチャする
            captureResultImage();
            
            clearScene(); 
            
            document.getElementById('score-display').classList.add('hidden');
            document.getElementById('timer-display').classList.add('hidden');
            
            showResultScreen();
        }

        function toggleMode() {
            if (currentMode === 'view' || currentMode === 'result') {
                startGameMode();
            } else {
                startViewMode();
            }
        }

        // ==========================
        // ゲームロジック
        // ==========================

        function spawnHotarin(parent) {
            hotarinCount++;
            const seed = Math.random() * 1000;
            const container = document.createElement('a-entity');
            container.classList.add('clickable');
            
            // ゲーム用（hotarin2）のロジックとモデルをセット
            const logicEntity = document.createElement('a-entity');
            logicEntity.setAttribute('hotarin2-logic', `showDebugBox: false; seed: ${seed}`);
            
            const model = document.createElement('a-gltf-model');
            model.setAttribute('src', '#hotarin2Model');
            model.setAttribute('rotation', '90 0 0');
            model.setAttribute('animation-mixer', '');
            
            const sphere = document.createElement('a-sphere');
            sphere.setAttribute('radius', '1.0'); 
            sphere.setAttribute('material', 'opacity: 0; transparent: true');
            
            logicEntity.appendChild(model);
            logicEntity.appendChild(sphere);
            container.appendChild(logicEntity);

            parent.appendChild(container);

            setTimeout(() => {
                if (container.parentNode) {
                    container.parentNode.removeChild(container);
                    hotarinCount--;
                }
            }, 10000);
        }

        function catchHotarin(element) {
            if (element.parentNode) {
                element.parentNode.removeChild(element);
                hotarinCount--;
                score++;
                updateScoreUI();
            }
        }

        // ==========================
        // リザルト画像生成＆シェアロジック
        // ==========================

        function captureResultImage() {
            const scene = document.querySelector('a-scene');
            const video = document.querySelector('video');
            if(!video || !scene.renderer) return;
            
            // WebGLの描画内容を最新にする
            scene.renderer.render(scene.object3D, scene.camera);
            
            const canvas = document.createElement('canvas');
            // スマホ画面と同じサイズでキャンバスを作成
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            
            // 1. ビデオ背景を画面のアスペクト比に合わせてトリミング描画（端が切れない・歪まないように）
            if(video.videoWidth) {
                const videoRatio = video.videoWidth / video.videoHeight;
                const canvasRatio = canvas.width / canvas.height;
                let sx = 0, sy = 0, sWidth = video.videoWidth, sHeight = video.videoHeight;
                
                if (videoRatio > canvasRatio) {
                    sWidth = video.videoHeight * canvasRatio;
                    sx = (video.videoWidth - sWidth) / 2;
                } else {
                    sHeight = video.videoWidth / canvasRatio;
                    sy = (video.videoHeight - sHeight) / 2;
                }
                ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            // 2. AR空間を描画
            ctx.drawImage(scene.canvas, 0, 0, canvas.width, canvas.height);
            
            // 3. テキスト（スコアとハッシュタグ）を合成して描き込む
            const padding = 20;
            const bgHeight = 160;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.fillRect(0, canvas.height - bgHeight, canvas.width, bgHeight);
            
            ctx.fillStyle = '#ff9800';
            // スマホ画面サイズに合わせてフォントサイズを調整
            const fontSize = Math.min(canvas.width * 0.08, 50); 
            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(`ほたりんを ${score}匹 捕まえた！`, canvas.width / 2, canvas.height - 90);
            
            const hashSize = Math.min(canvas.width * 0.04, 24);
            ctx.font = `bold ${hashSize}px sans-serif`;
            ctx.fillStyle = '#333333';
            ctx.fillText(HASHTAGS, canvas.width / 2, canvas.height - 35);
            
            // Blob（ファイル実体）に変換して保持しておく
            canvas.toBlob((blob) => {
                resultImageBlob = blob;
                if(resultImageUrl) URL.revokeObjectURL(resultImageUrl);
                resultImageUrl = URL.createObjectURL(blob);
            }, 'image/jpeg', 0.9);
        }

        function shareTo() {
            const text = `ARでほたりんを ${score}匹 捕まえたよ！\n${HASHTAGS}`;
            const url = window.location.href;
            
            // Web Share API（画像ファイルを直接渡せるかチェック）
            if (navigator.canShare && resultImageBlob) {
                const file = new File([resultImageBlob], `hotarin_result_${Date.now()}.jpg`, { type: 'image/jpeg' });
                // ファイル添付でのシェアに対応している環境（スマホ等）
                if (navigator.canShare({ files: [file] })) {
                    navigator.share({
                        title: 'ほたりん虫取りゲーム',
                        text: text,
                        url: url,
                        files: [file]
                    }).catch(console.error);
                    return; // 成功すればネイティブアプリが開くので関数終了
                }
            }
            
            // --- ファイル直接シェア非対応の場合（PCなど） ---
            
            // 画像をユーザーの端末に自動ダウンロードさせる
            if (resultImageUrl) {
                const link = document.createElement('a');
                link.download = `hotarin_result_${Date.now()}.jpg`;
                link.href = resultImageUrl;
                link.click();
                alert('結果画像をダウンロードしました。\nお好きなSNSを開いて、画像を添付して投稿してください！\n\n【おすすめハッシュタグ】\n' + HASHTAGS);
            }
        }

        // ==========================
        // UI操作ロジック
        // ==========================

        function updateScoreUI() {
            document.getElementById('score-display').innerText = `捕まえた数: ${score}`;
        }

        function updateTimerUI() {
            const timerEl = document.getElementById('timer-display');
            timerEl.innerText = `残り時間: ${timeLeft}秒`;
            if (timeLeft <= 3) {
                timerEl.style.background = 'rgba(255, 0, 0, 1)';
            } else {
                timerEl.style.background = 'rgba(255, 100, 100, 0.9)';
            }
        }

        function showResultScreen() {
            const resultScreen = document.getElementById('result-screen');
            const resultScore = document.getElementById('result-score');
            const resultMessage = document.getElementById('result-message');
            
            resultScore.innerText = `${score} 匹捕まえた！`;
            
            let msg = RESULT_MESSAGES[RESULT_MESSAGES.length - 1].text;
            for (let i = 0; i < RESULT_MESSAGES.length; i++) {
                if (score >= RESULT_MESSAGES[i].min) {
                    msg = RESULT_MESSAGES[i].text;
                    break;
                }
            }
            resultMessage.innerText = msg;
            
            resultScreen.classList.remove('hidden');
        }

        function showBugNet(x, y) {
            const net = document.createElement('div');
            net.innerText = '🕸️';
            net.style.position = 'fixed';
            net.style.left = (x - 25) + 'px';
            net.style.top = (y - 25) + 'px';
            net.style.fontSize = '50px';
            net.style.pointerEvents = 'none';
            net.style.zIndex = '2000';
            net.style.transition = 'all 0.3s ease-out';
            net.style.transform = 'scale(0)';
            document.body.appendChild(net);

            setTimeout(() => {
                net.style.transform = 'scale(1) rotate(-45deg)';
                net.style.opacity = '1';
            }, 10);
            setTimeout(() => {
                net.style.transform = 'scale(1.2) rotate(0deg)';
                net.style.opacity = '0';
            }, 300);
            setTimeout(() => {
                net.remove();
            }, 600);
        }

        function toggleCredits() { document.querySelector('#credits-info').classList.toggle('hidden'); }
        function takePhoto() {
            const scene = document.querySelector('a-scene');
            const video = document.querySelector('video');
            if(!video) return;
            scene.renderer.render(scene.object3D, scene.camera);
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.drawImage(scene.canvas, 0, 0, canvas.width, canvas.height);
            const link = document.createElement('a');
            link.download = `ar-capture-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>

    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #header { position: fixed; top: 0; width: 100%; height: 80px; background: white; z-index: 1000; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #header p { font-weight: bold; margin: 0; }
        #info-btn { position: fixed; top: 20px; right: 20px; width: 40px; height: 40px; background: rgba(0,0,0,0.5); color: white; border-radius: 50%; z-index: 1100; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border: 2px solid white; }
        #credits-info { position: fixed; top: 80px; right: 20px; width: 260px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 10px; z-index: 1050; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 0.8rem; line-height: 1.4; color: #333; }
        .hidden { display: none !important; }
        video, .a-canvas { top: 80px !important; height: calc(100% - 80px) !important; }
        
        /* ボタン類 */
        #capture-btn { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; background: white; border-radius: 50%; z-index: 1001; border: 5px solid #ccc; cursor: pointer; }
        #score-display { position: fixed; bottom: 20px; left: 20px; background: rgba(0, 0, 0, 0.7); color: white; padding: 10px 20px; border-radius: 20px; font-size: 1.2rem; font-weight: bold; z-index: 1001; border: 2px solid #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: none; }
        #mode-toggle-btn { position: fixed; bottom: 20px; right: 20px; background: #ff9800; color: white; padding: 10px 20px; border-radius: 20px; font-size: 1rem; font-weight: bold; z-index: 1001; border: 2px solid #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer; user-select: none; }
        #mode-toggle-btn:active { transform: scale(0.95); }

        /* タイマー表示 */
        #timer-display { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); background: rgba(255, 100, 100, 0.9); color: white; padding: 10px 25px; border-radius: 25px; font-size: 1.5rem; font-weight: bold; z-index: 1001; border: 2px solid #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: none; transition: background 0.3s; }

        /* リザルト画面（オーバーレイ） */
        #result-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; display: flex; align-items: center; justify-content: center; flex-direction: column; color: white; text-align: center; }
        .result-content { background: white; color: #333; padding: 30px; border-radius: 15px; width: 85%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .result-content h2 { margin-top: 0; color: #ff9800; font-size: 1.8rem; }
        #result-score { font-size: 1.8rem; font-weight: bold; margin: 15px 0; color: #e91e63; }
        #result-message { font-size: 1.1rem; margin-bottom: 25px; line-height: 1.5; color: #444; font-weight: bold; }
        .result-buttons button { display: block; width: 100%; padding: 15px; margin-bottom: 12px; border: none; border-radius: 30px; background: #ff9800; color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .result-buttons button:active { transform: scale(0.98); }
        .result-buttons button.btn-secondary { background: #888; margin-bottom: 0; }
        
        /* シェアボタン */
        .share-section { margin-top: 25px; border-top: 2px dashed #ccc; padding-top: 15px; }
        .share-section p { margin: 0 0 10px 0; font-size: 0.9rem; color: #777; font-weight: bold; }
        .share-buttons { display: flex; justify-content: center; gap: 8px; }
        .share-btn { flex: 1; padding: 12px 0; border: none; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .share-btn.unified { background: linear-gradient(45deg, #ff9800, #e91e63); }
        .share-btn:active { transform: scale(0.98); }

        /* VRボタンを強制非表示 */
        .a-enter-vr { display: none !important; }
    </style>
</head>
<body>
    <div id="header"><p>Loading...</p></div>
    <div id="info-btn" onclick="toggleCredits()">i</div>
    <div id="credits-info" class="hidden">
        <h3>Licenses & Credits</h3>
        <p>AR: Mind-AR (MIT) / Models: Meshy (CC BY 4.0)</p>
    </div>
    
    <!-- AR・鑑賞用UI -->
    <div id="capture-btn" onclick="takePhoto()"></div>
    <div id="mode-toggle-btn" onclick="toggleMode()">ゲームモードにする</div>

    <!-- ゲームプレイ用UI -->
    <div id="timer-display" class="hidden">残り時間: 10秒</div>
    <div id="score-display" class="hidden">捕まえた数: 0</div>

    <!-- リザルト画面（オーバーレイ） -->
    <div id="result-screen" class="hidden">
        <div class="result-content">
            <h2>結果発表！</h2>
            <p id="result-score">0 匹捕まえた！</p>
            <p id="result-message">まだまだです。もっとがんばりましょう</p>
            
            <div class="result-buttons">
                <button onclick="startGameMode()">リセットして再挑戦</button>
                <button onclick="startViewMode()" class="btn-secondary">鑑賞モードへ戻る</button>
            </div>
            
            <div class="share-section">
                <p>結果画像をシェアする</p>
                <div class="share-buttons">
                    <button class="share-btn unified" onclick="shareTo()">📤 SNSでシェアする</button>
                </div>
            </div>
        </div>
    </div>

    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable" renderer="preserveDrawingBuffer: true; alpha: true; colorManagement: true;" vr-mode-ui="enabled: false">
        <a-assets id="asset-manager"></a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
</body>
</html>
